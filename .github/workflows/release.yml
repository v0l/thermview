name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux build and packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libwayland-dev libxkbcommon-dev libgtk-3-dev dpkg-dev python3
      - name: Release packaging tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 -m unittest discover -s tests -p 'test_release_packaging.py' -v
      - run: cargo build --release --locked -p thermview --target ${{ matrix.target }}
      - name: Debian package
        if: runner.os == 'Linux'
        shell: bash
        env:
          THERMVIEW_BINARY: target/${{ matrix.target }}/release/thermview
        run: packaging/linux/build-deb.sh "${{ matrix.target }}"
      - name: app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "thermview") | .version')
          app="dmg/ThermView.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          sed "s/__VERSION__/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          cp "target/${{ matrix.target }}/release/thermview" "$app/Contents/MacOS/"
          cp packaging/macos/icon.icns "$app/Contents/Resources/"
          codesign --force --deep --sign - "$app"
          ln -s /Applications dmg/Applications
          name=thermview-${{ matrix.target }}
          hdiutil create -volname "ThermView" -srcfolder dmg -fs HFS+ -format UDZO -ov "dist/$name.dmg"
          (cd dist && shasum -a 256 "$name.dmg" > "$name.dmg.sha256")
      - name: install wix
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2
      - name: msi
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "thermview") | .version')
          name=thermview-${{ matrix.target }}
          wix build -arch x64 -pdbtype none \
            -d "Version=${version%%-*}" \
            -d "BinDir=target/${{ matrix.target }}/release" \
            -o "dist/$name.msi" packaging/windows/thermview.wxs
          (cd dist && sha256sum "$name.msi" > "$name.msi.sha256")
      - uses: actions/upload-artifact@v6
        with:
          name: thermview-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.deb
            dist/*.msi
            dist/*.sha256

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Arch build dependencies
        run: pacman -Syu --noconfirm --needed git rust cmake pkgconf python gtk3 wayland libxkbcommon libxkbcommon-x11 libx11 libxcb libxcursor libxi libxrandr libglvnd vulkan-icd-loader hicolor-icon-theme shared-mime-info desktop-file-utils
      - uses: actions/checkout@v5
      - name: Build and test native Arch package as an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash packaging/arch/build-package.sh
      - uses: actions/upload-artifact@v6
        with:
          name: thermview-arch-x86_64
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    needs: [build, arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '/^## \[/{p=index($0,"[" v "]")>0;next} /^\[[^]]*\]: /{p=0} p' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no entry for ${TAG#v}"; exit 1; }
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create or update release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 packaging/prepare-release.py --version "${GITHUB_REF_NAME#v}" --repo "$GITHUB_REPOSITORY" --input dist --output release-assets --notes notes.md
          bash packaging/publish-release.sh "${GITHUB_REF_NAME}" release-assets notes.md
