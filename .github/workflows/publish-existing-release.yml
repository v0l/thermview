name: Publish completed release builds

on:
  # Recover v0.2.1 on this workflow's first push without rebuilding its binaries.
  push:
    branches: [v0.2.1]
    paths: ['.github/workflows/publish-existing-release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.2.1
      run_id:
        description: Release workflow run whose five builds succeeded
        required: true
        default: '43899869517'

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-existing-${{ inputs.tag || 'v0.2.1' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || 'v0.2.1' }}
      SOURCE_RUN_ID: ${{ inputs.run_id || '43899869517' }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify build source and successful platform jobs
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > source-run.json
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}"
          tag_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          echo "VERIFIED_TAG_SHA=$tag_sha" >> "$GITHUB_ENV"
          test "$(jq -r .head_sha source-run.json)" = "$tag_sha"
          test "$(jq -r .path source-run.json)" = '.github/workflows/release.yml'
          test "$(jq -r .status source-run.json)" = completed
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" > source-jobs.json
          jq -e '[.jobs[] | select(.name | startswith("build ("))] | length == 5 and all(.[]; .conclusion == "success")' source-jobs.json
          case "${RELEASE_TAG#v}" in
            0.1.*|0.2.0|0.2.1) echo 'CLEAN_RELEASE_ASSETS=false' >> "$GITHUB_ENV" ;;
            *)
              jq -e '[.jobs[] | select(.name == "arch")] | length == 1 and all(.[]; .conclusion == "success")' source-jobs.json
              echo 'CLEAN_RELEASE_ASSETS=true' >> "$GITHUB_ENV"
              ;;
          esac
      - name: Download completed platform artifacts
        run: gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'thermview-*' --dir artifacts
      - name: Collect artifacts and release notes from the tagged source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil
          platforms = ['x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu', 'x86_64-pc-windows-msvc', 'aarch64-apple-darwin', 'x86_64-apple-darwin']
          if os.environ['CLEAN_RELEASE_ASSETS'] == 'true':
              platforms.append('arch-x86_64')
          output = Path('dist')
          output.mkdir()
          for platform in platforms:
              folder = Path('artifacts') / ('thermview-' + platform)
              files = list(folder.rglob('*'))
              files = [p for p in files if p.is_file()]
              assert files, 'Missing artifacts for ' + platform
              for source in files:
                  destination = output / source.name
                  assert not destination.exists(), 'Duplicate artifact: ' + source.name
                  shutil.copyfile(source, destination)
          PY
          git show "${VERIFIED_TAG_SHA}:CHANGELOG.md" > release-changelog.md
          awk -v v="${RELEASE_TAG#v}" '/^## \[/{p=index($0,"[" v "]")>0;next} /^\[[^]]*\]: /{p=0} p' release-changelog.md > notes.md
          test -s notes.md
          (cd dist && sha256sum --check ./*.sha256)
      - name: Create or update release and upload artifacts
        run: |
          if [ "$CLEAN_RELEASE_ASSETS" = true ]; then
            python3 packaging/prepare-release.py --version "${RELEASE_TAG#v}" --repo "$GITHUB_REPOSITORY" --input dist --output release-assets --notes notes.md
            bash packaging/publish-release.sh "$RELEASE_TAG" release-assets notes.md
          else
            bash packaging/publish-release.sh "$RELEASE_TAG" dist notes.md
          fi
