[package]
name = "thermview"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Radiometric thermal image viewer: IRG, Hikmicro, DJI and FLIR files"
repository = "https://github.com/v0l/thermview"

[workspace]
members = [".", "web"]

[dependencies]
egui = "0.35"
egui_bench = "0.5.4"
png = "0.18"
kamadak-exif = "0.6.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
clap = { version = "4.6", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Document", "Element", "File", "FileList", "HtmlAnchorElement", "HtmlInputElement", "Url", "Window"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1
